name: PayBridge protocol checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python spx_paybridge_scotia/tools/check_module.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test spx_paybridge_scotia/tests/test_checkout.mjs
      - run: node --test spx_paybridge_scotia_pos/tests/test_online_payment.mjs
      - uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: dbe0c5015da3b1f00c25613572fed695d8470d20
          path: odoo-reference
          persist-credentials: false
          sparse-checkout: |
            addons/pos_online_payment/static/src/app/utils/order_payment_validation.js
          sparse-checkout-cone-mode: false
      - run: node --test spx_paybridge_scotia_pos/tests/test_online_payment.mjs
        env:
          ODOO_ROOT: ${{ github.workspace }}/odoo-reference
