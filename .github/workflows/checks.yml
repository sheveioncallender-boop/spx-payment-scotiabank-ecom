name: PayBridge protocol checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python spx_paybridge_scotia/tools/check_module.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test spx_paybridge_scotia/tests/test_checkout.mjs
